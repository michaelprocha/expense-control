<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>infomoney</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./css/index.css">
	</head>
	<body>
        <main class="flex flex-col items-center justify-center flex-1">
            <h1 class="pb-4">InfoMoney</h1>
            <h3 class="pb-2">Login</h3>
            <p class="text-center py-2 pb-4">Não tem conta? <a class="text-primary font-medium" href="./register.html">Cadastrar</a></p>
            <form class="flex flex-col gap-3 w-full max-w-2xs">
                <div class="flex flex-col">
                    <label for="email">Endereço de email</label>
                    <input class="p-1.5" name="email" id="email" type="email">
                </div>
                <div class="flex flex-col">
                    <label for="password">Senha</label>
                    <input class="p-1.5" id="password" name="password" type="password">
                </div>
                <button class="py-2 mt-2.5" type="submit">Logar</button>
            </form>
            <a class="pt-2 text-negative font-medium" href="./forgot.html">Esqueceu sua senha?</a>
        </main>
        <footer class="flex justify-center py-6">
            <a>Desenvolvido por Michael Rocha</a>
        </footer>
        <script src="./javascript/index.js"></script>
    </body>
</html>
