<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>infomoney</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/index.css" />
	</head>
	<body>
		<main class="flex flex-col items-center justify-center flex-1">
			<h3 class="pb-2 text-2xl">Esqueci minha senha!</h3>
			<p class="pb-4 px-2 max-w-92 text-center">
				Para recuperar a senha, informe o email cadastrado e lhe enviaremos um email com as instruções para recuperação.
			</p>
			<form class="flex flex-col gap-3 w-full max-w-2xs">
				<div class="flex flex-col">
					<label for="email">Email</label>
					<input class="p-1.5" name="email" type="email" name="email" id="email" />
				</div>
				<button class="py-2 mt-2.5" type="button">Próximo</button>
			</form>
			<a class="text-negative pt-2 font-medium" href="./index.html">Cancelar</a>
		</main>
		<footer class="flex justify-center py-6">
			<a>Desenvolvido por Michael Rocha</a>
		</footer>
	</body>
</html>
