<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>infomoney</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/index.css" />
	</head>
	<body>
		<main class="main">
            <h1>InfoMoney</h1>
			<form class="form">
				<div class="field">
                    <label for="first_name" class="field__label">Primeiro Nome</label>
                    <input class="field__input" type="text" name="firstName" id="first_name">
                </div>
				<div class="field">
                    <label for="last_name" class="field__label">Sobrenome</label>
                    <input class="field__input" type="text" name="lastName" id="last_name">
                </div>
				<div class="field">
                    <label for="email" class="field__label">Email</label>
                    <input class="field__input" type="email" name="email" id="email">
                </div>
				<div class="field">
                    <label for="password" class="field__label">Senha</label>
                    <input class="field__input" type="password" name="password" id="password">
                </div>
                <button class="button-form" type="button">Cadastrar</button>
			</form>
            <a class="link-goback" href="./index.html">Voltar</a>
		</main>
	</body>
</html>
