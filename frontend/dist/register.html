<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>infomoney</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/index.css" />
	</head>
	<body>
		<main class="flex flex-col items-center justify-center flex-1">
			<h1 class="pb-4">InfoMoney</h1>
			<form class="flex flex-col gap-3 w-full max-w-2xs">
				<div class="flex flex-col">
					<label for="first_name">Primeiro Nome</label>
					<input class="p-1.5" type="text" name="firstName" id="first_name" />
				</div>
				<div class="flex flex-col">
					<label for="last_name">Sobrenome</label>
					<input class="p-1.5" type="text" name="lastName" id="last_name" />
				</div>
				<div class="flex flex-col">
					<label for="email">Email</label>
					<input class="p-1.5" type="email" name="email" id="email" />
				</div>
				<div class="flex flex-col">
					<label for="password">Senha</label>
					<input class="p-1.5" type="password" name="password" id="password" />
				</div>
				<button class="py-2 mt-2.5" type="button">Cadastrar</button>
			</form>
			<a class="text-primary font-medium pt-2" href="./index.html">Voltar</a>
		</main>
		<footer class="flex justify-center py-6">
			<a>Desenvolvido por Michael Rocha</a>
		</footer>
	</body>
</html>
