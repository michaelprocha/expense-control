<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>infomoney</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/index.css" />
	</head>
	<body>
		<header class="flex justify-between items-center py-4 px-8">
			<h1 class="text-3xl">InfoMoney</h1>
			<nav>
				<a href="">Perfil</a>
				<a href="">Sair</a>
			</nav>
		</header>
		<main class="flex flex-col flex-1">
			<form class="flex flex-col gap-3 w-full px-8 py-16">
				<h3 class="text-xl">Adicionar compra</h3>
				<div class="flex flex-col">
					<label for="product">Nome do produto</label>
					<input class="p-1.5 max-w-md" name="productName" id="product" type="text" />
				</div>
				<div class="flex flex-col">
					<label for="value">Nome do produto</label>
					<input class="p-1.5 max-w-md" name="productValue" id="value" type="number" />
				</div>
				<div class="flex flex-col">
					<label for="date">Nome do produto</label>
					<input class="p-1.5 max-w-md" name="productDate" id="date" type="date" />
				</div>
				<button class="py-2 mt-2.5 max-w-md">Adicionar</button>
			</form>
			<section class="flex flex-col px-8 pb-22">
				<h3 class="text-xl">Produtos comprados</h3>
				<ul id="products-list" class="py-4 flex flex-col gap-6">
					<li class="p-4 bg-primary rounded-2xl flex flex-col justify-between">
						<div class="flex flex-col items-center gap-2">
							<h4 class="text-l">Arroz</h4>
							<div class="w-full flex justify-between">
								<p>R$ 1000</p>
								<p>24/10/2015</p>
							</div>
						</div>
						<div class="w-full flex justify-between">
							<a>EDITAR</a>
							<a>EXCLUIR</a>
						</div>
					</li>
				</ul>
			</section>
		</main>
		<footer class="flex justify-center py-6">
			<a>Desenvolvido por Michael Rocha</a>
		</footer>
		<script type="module" src="./javascript/products.js"></script>
	</body>
</html>
