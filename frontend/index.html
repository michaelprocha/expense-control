<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>infomoney</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./css/index.css">
	</head>
	<body>
        <main class="main">
            <h1 class="title">InfoMoney</h1>
            <h3 class="sub-title">Login</h3>
            <p class="text">Não tem conta? <a class="text-register" href="">Cadastrar</a></p>
            <form class="form">
                <div class="field">
                    <label class="field__label" for="email">Endereço de email</label>
                    <input class="field__input" id="email" type="email">
                </div>
                <div class="field">
                    <label class="field__label" for="password">Senha</label>
                    <input class="field__input" id="password" type="password">
                </div>
                <button class="button" type="button">Logar</button>
            </form>
            <a class="text-forget" href="">Esqueceu sua senha?</a>
        </main>
        <footer class="footer">
            <a class="footer-text">Desenvolvido por Michael Rocha</a>
        </footer>
    </body>
</html>
