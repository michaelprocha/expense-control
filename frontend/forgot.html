<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>infomoney</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/index.css" />
	</head>
	<body>
        <main class="main">
            <h3>Esqueci minha senha</h3>
            <p class="text-w-limited">Para recuperar a senha, informe o email cadastrado e lhe enviaremos um email com as instruções para recuperação.</p>
            <form class="field" action="">
                <label class="field__label" for="email">Email</label>
                <input class="field__input" type="email" name="email" id="email">
                <button class="button" type="button">Próximo</button>
            </form>
            <a href="">Cancelar</a>
        </main>
    </body>
